# CI: the gates this repository runs.
#
# Four gates run here as Actions jobs. The `main` ruleset requires three of them plus
# CodeScene's Code Health Review, which is the odd one: it arrives as an App check-run
# rather than an Actions job, so it has no job log and `gh run list` reports CI green while
# that check is red. It reports on every pull request, including one that changes no code.
#
# CodeQL is not required. Code scanning is free on a public repository and needs GitHub
# Advanced Security on a private one, so the job stays dormant until the public flip.
#
#   1. Publish hygiene  -> identity/infrastructure leaks in tracked files
#   2. Gitleaks         -> committed credentials, full history
#   3. Tests + lint     -> both suites offline, plus ruff
#   4. CodeQL           -> static analysis, dormant while the repository is private
#   5. CodeScene        -> Code Health gate, App check-run, required on main
#
# Deliberately absent: a supply-chain scanner. This repository has no third-party
# runtime dependencies, so such a job would have nothing to scan while still
# showing a green check. Revisit the moment a dependency appears.
#
# Action refs are pinned to the commit SHA of the version named beside each use, so
# a retargeted tag cannot change what runs here. Bump a pin deliberately, the way
# the gitleaks digest below is bumped.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-hygiene:
    name: Publish hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - name: No internal identity or infrastructure in tracked files
        run: bash scripts/publish-hygiene.sh

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0
      # The gitleaks action derives a scan range from the push. On the first push of a
      # repository that range has no valid form, because its first commit has no parent, so
      # git exited with "ambiguous argument" and the job failed having scanned nothing. It
      # also scanned that range rather than the history this gate is named for. Installing
      # the binary and scanning every commit fixes both, and the version is pinned so a new
      # release cannot change the result silently. The tarball digest is pinned to the
      # value the release publishes in gitleaks_8.30.1_checksums.txt, so the gate binary
      # itself is verified before it runs.
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f /tmp/gitleaks.tar.gz gitleaks
      - name: Scan every commit
        run: gitleaks git --log-opts=--all --no-banner --redact

  tests:
    name: Tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install lint tooling
        run: pip install ruff==0.16.10
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: Suites
        run: bash scripts/run-suites.sh

  codeql:
    name: CodeQL
    # Code scanning is free on public repositories; on a private repository it
    # requires GitHub Advanced Security. This guard keeps the job dormant while the
    # repository is private and switches it on by itself at the public flip, rather
    # than leaving a permanently red check that everyone learns to ignore.
    #
    # Injection note: this is the only `${{ }}` expression in the file and it is a
    # boolean evaluated by the workflow engine in a job-level `if:`. No event field is
    # ever interpolated into a `run:` block, which is the injection shape to avoid.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: github/codeql-action/init@439137e1b50c27ba9e2f9befc93e43091b449c34 # v3.32.0
        with:
          languages: python
      - uses: github/codeql-action/analyze@439137e1b50c27ba9e2f9befc93e43091b449c34 # v3.32.0
