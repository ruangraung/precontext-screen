name: precontext-screen
version: 1.0.0
description: >-
  Screens untrusted web/browser tool results for prompt injection with TypeSafe Jev
  before they enter the agent's context. A hostile result keeps its own text and gains
  an in-line banner that marks it untrusted and tells the agent to report it, and every
  verdict is logged without the content. Fails open: if screening is unavailable the
  result passes through untouched.
author: ruangraung
kind: standalone
provides_hooks:
  - transform_tool_result
hooks:
  - transform_tool_result
